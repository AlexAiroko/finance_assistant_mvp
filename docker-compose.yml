services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER required in .env}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS required in .env}
      POSTGRES_DB: ${DB_NAME:?DB_NAME required in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Проброс для pgAdmin / psql с хоста. Не конфликтует с локальным PostgreSQL на 5432.
      - "${DB_PORT_FORWARD:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Внутри compose-сети сервис называется `db`, а не `localhost`.
      # Остальные настройки (DB_USER, DB_PASS, DB_NAME, JWT_SECRET_KEY, ...) — из .env.
      DB_HOST: db
      DB_PORT: "5432"
      APP_ENV: ${APP_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    command: >
      sh -c "alembic upgrade head &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
